name: Refresh news signals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [ main, feat/khmer-hantavirus-map ]
    paths: ['scripts/fetch-news.mjs', '.github/workflows/refresh-news.yml']

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "hantavirus-bot"
          git config user.email "hantavirus-bot@users.noreply.github.com"
          if git diff --quiet data/news.json; then echo "No changes."; exit 0; fi
          git add data/news.json
          git commit -m "chore(news): auto-refresh signals $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
